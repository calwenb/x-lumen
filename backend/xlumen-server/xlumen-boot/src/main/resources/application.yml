# ============================================================
# xLumen 基础配置（决策 D29/D31）
# 本文件 = 环境切换开关 + 真正与环境无关的公共配置（连接池策略、健康检查、日志、模型选型、
# Agent 参数等）。环境属性键（中间件地址/端口/库名、site-url、端口守卫、各密钥）一律写在
# 对应 application-<env>.yml——即使当前各环境值相同（D31 修订 D29 的「各环境文件自我完整」条款）。
# 铁律：base 随仓库提交，任何密钥值不得出现在本文件。
# ============================================================
spring:
  profiles:
    active: dev                            # 默认 dev；部署脚本用 --spring.profiles.active=test|prod 覆盖
  application:
    name: xlumen
  # Spring AI：关闭全部六个 OpenAI 自动配置（D20，供应商手动装配）
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  mail:
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  data:
    redis:
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
  servlet:
    encoding:
      charset: UTF-8
      force: true
  main:
    allow-circular-references: true

management:
  # 健康检查（部署脚本轮询 /actuator/health 依赖）
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

xlumen:
  bailian:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    tts-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
    # 2026-09 性价比重选：flash 新代（0.2/0.8 元每百万 Token，≤32K 档）替代旧代 plus（0.8/2+思考8）
    model-writing: qwen3.7-flash
    model-reviewer: qwen3.8-flash          # 0.8/2.7 元 ≤1M 一口价；与写作异模型名即过 checkHeterogeneous（仅拦 provider+model 全同）
    model-qa: qwen3.7-flash
    model-summary: qwen3.7-flash
    model-vision: qwen3-vl-flash           # VL 档最低（0.15/1.5），维持
    model-tts: qwen3-tts-flash             # 0.8 元/万字符，维持
    model-embedding: qwen3.7-text-embedding-flash  # 0.125 元/百万 Token（v4 的 1/4）；compatible-mode 可用，默认 1024 维与现集合一致，但向量空间不同——切换后须 drop kb_chunks 并全量 reindex
  deepseek:
    base-url: https://api.deepseek.com
    model-writing: deepseek-chat
    model-reviewer: deepseek-chat
    model-qa: deepseek-chat
    model-summary: deepseek-chat
  agent-max-rounds: 5
  agent-tool-timeout-millis: 10000
  agent-max-tool-calls: 8
  agent-tool-result-max-chars: 8000
  reviewer-agent-max-rounds: 2
  writing-max-chapters: 8
  writing-rag-enabled: true
  trace-cost-per-1k: 0.001                 # 追踪日志粗算单价：按 qwen3.7-flash 输入/输出混合约 1 元/百万 Token
  tts-voice: Cherry

logging:
  level:
    root: INFO
    com.calwen.xlumen: INFO
