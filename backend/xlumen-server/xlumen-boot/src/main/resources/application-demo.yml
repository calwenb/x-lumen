# ============================================================
# xLumen 环境配置模板（决策 D29/D30/D31）
# 复制为 application-dev.yml / application-test.yml / application-prod.yml 后填真实值。
# D31 划分原则：application.yml 只放与环境无关的公共项（连接池/健康检查/日志/模型选型/Agent 参数）；
# 本模板列出的都是「环境属性 + 密钥」——中间件地址端口库名、site-url、端口守卫等即使各环境
# 当前值相同也写在这里。需要覆盖公共项时在 profile 写同名键即可（如 model-reviewer）。
# 键名说明：XLUMEN_* 环境变量在 YAML 中写作小写点号（XLUMEN_BAILIAN_API_KEY → xlumen.bailian.api-key）
# ============================================================
server:
  port: <应用端口>

spring:
  datasource:
    url: jdbc:mysql://<MySQL地址>:3306/<库名>?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: <用户名>
    password: <密码>
  mail:
    host: <SMTP 主机>             # 留空 "" = 不发真邮件，验证码落日志
    port: 465
    username: <发件账号>
    password: <SMTP 授权码>
  data:
    redis:
      host: <Redis 地址>
      port: 6379
      password: <Redis 密码>
      database: <逻辑库 index>    # 各环境用不同 index 隔离

xlumen:
  jwt-secret: <openssl rand -hex 24 生成，各环境独立>
  bailian:
    api-key: <百炼 API Key>
  deepseek:
    api-key: <DeepSeek API Key，未启用留 "">
  milvus:
    host: <Milvus 地址，不可达自动降级>
    port: 19530
    database: default
  site-url: <站点对外地址>
  mail-from: <发件地址，与 mail.username 一致>
  dev-port-guard: false
